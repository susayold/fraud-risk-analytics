name: Part 9 Portfolio Tests

on:
  push:
    paths:
      - "part-*.html"
      - "css/part-9.css"
      - "js/part-9.js"
      - "src/part9/**"
      - "tests/part9/**"
      - "reports/**"
      - "docs/**"
      - "assets/data/**"
      - "README.md"
  pull_request:
    paths:
      - "part-*.html"
      - "css/part-9.css"
      - "js/part-9.js"
      - "src/part9/**"
      - "tests/part9/**"
      - "reports/**"
      - "docs/**"
      - "assets/data/**"
      - "README.md"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install pandas
      - run: python -m src.part9.build_part9_assets
      - run: python -m src.part9.validate_part9
      - run: python -m unittest discover -s tests/part9 -p "test_*.py"
