name: Part 8 Tests

on:
  push:
    paths:
      - "src/part8/**"
      - "src/part8_public/**"
      - "src/part7/**"
      - "config/part8/**"
      - "config/part7/**"
      - "tests/part8/**"
      - "tests/part8_public/**"
      - "reports/part8/part8_validation_report.csv"
      - "assets/data/part8_summary.json"
      - "scripts/run_part8_tests.py"
      - "requirements-part8.txt"
      - ".github/workflows/part8-tests.yml"
  pull_request:
    paths:
      - "src/part8/**"
      - "src/part8_public/**"
      - "src/part7/**"
      - "config/part8/**"
      - "config/part7/**"
      - "tests/part8/**"
      - "tests/part8_public/**"
      - "reports/part8/part8_validation_report.csv"
      - "assets/data/part8_summary.json"
      - "scripts/run_part8_tests.py"
      - "requirements-part8.txt"
      - ".github/workflows/part8-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements-part8.txt
      - name: Part 8 software tests
        run: python scripts/run_part8_tests.py
      - name: Part 8 final public evidence contract
        run: python -m src.part8_public.validate_public_evidence

      # src.part8.validate_part8 remains the canonical private execution validator.
      # Public CI does not fabricate access to the private decision/monitoring marts.
