version: PART7_DECISION_ENGINE_v2.1_FINAL
decision_unit: transaction
actions:
- ALLOW
- REVIEW
- BLOCK
policy_mode_default: BACKTEST
oot_not_globally_unseen: true
primary_objective: MINIMIZE_TOTAL_SIMULATED_COST
review_overflow_action: ALLOW
action_precedence_config: action_precedence.yaml
review_queue_config: review_queue.yaml
temporal_scope_config: temporal_scopes.yaml
graph_autoblock_allowed: false
hard_block:
  enabled: false
threshold_search:
  method: score_quantiles
  quantiles:
  - 0.9
  - 0.93
  - 0.95
  - 0.97
  - 0.98
  - 0.985
  - 0.99
  - 0.9925
  - 0.995
  - 0.9975
  - 0.999
  - 0.9995
  max_threshold_pairs: 4
capacities:
- 0.01
selection:
  scope: P7_POLICY_CONFIRM
  primary_metric: simulated_total_cost
  tie_break:
  - lower_legitimate_block_rate
  - lower_review_rate
  - higher_fraud_exposure_capture
  - simpler_policy
