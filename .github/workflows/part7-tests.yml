name: Part 7 Tests

on:
  push:
    paths:
      - "src/part7/**"
      - "src/part7_public/**"
      - "config/part7/**"
      - "tests/part7/**"
      - "tests/part7_public/**"
      - "reports/part7/part7_validation_report.csv"
      - "assets/data/part7_summary.json"
      - "scripts/run_part7_tests.py"
      - ".github/workflows/part7-tests.yml"
  pull_request:
    paths:
      - "src/part7/**"
      - "src/part7_public/**"
      - "config/part7/**"
      - "tests/part7/**"
      - "tests/part7_public/**"
      - "reports/part7/part7_validation_report.csv"
      - "assets/data/part7_summary.json"
      - "scripts/run_part7_tests.py"
      - ".github/workflows/part7-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements-part7.txt
      - name: Part 7 software tests
        run: python scripts/run_part7_tests.py
      - name: Part 7 final public evidence contract
        run: python -m src.part7_public.validate_public_evidence

      # src.part7.validate_part7 is the canonical execution validator and is
      # intentionally not run in public CI because it verifies private row-level
      # score/decision artifacts and freeze inputs that are not published.
