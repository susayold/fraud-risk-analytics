name: Part 7 Tests

on:
  push:
    paths:
      - "src/part7/**"
      - "config/part7/**"
      - "tests/part7/**"
      - "scripts/run_part7_tests.py"
      - ".github/workflows/part7-tests.yml"
  pull_request:
    paths:
      - "src/part7/**"
      - "config/part7/**"
      - "tests/part7/**"
      - "scripts/run_part7_tests.py"
      - ".github/workflows/part7-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements-part7.txt
      - run: python scripts/run_part7_tests.py
      - run: python -m src.part7.validate_part7
